<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" fill="#3f7bff"/>
  <g transform="translate(256, 256)">
    <!-- Truck body -->
    <rect x="-120" y="-40" width="180" height="60" fill="white" rx="5"/>
    <!-- Truck cabin -->
    <rect x="-120" y="-40" width="60" height="60" fill="white" rx="5"/>
    <!-- Windows -->
    <rect x="-110" y="-30" width="40" height="40" fill="#3f7bff" rx="3"/>
    <!-- Wheels -->
    <circle cx="-80" cy="30" r="20" fill="#1a1a1a"/>
    <circle cx="40" cy="30" r="20" fill="#1a1a1a"/>
    <circle cx="-80" cy="30" r="12" fill="#666"/>
    <circle cx="40" cy="30" r="12" fill="#666"/>
  </g>
</svg>

